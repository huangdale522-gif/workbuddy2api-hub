name: Publish Docker image

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 branch / tag / commit（手动运行只发布 edge 与 sha 标签）"
        required: true
        default: main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Log in to Docker Hub
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Determine Docker images
      id: images
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        TARGETS="ghcr.io/${{ github.repository }}"
        if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
          TARGETS="$TARGETS
        ${{ github.repository }}"
        fi
        echo "list<<EOF" >> $GITHUB_OUTPUT
        echo "$TARGETS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: Resolve release tag
      id: release
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=edge" >> "$GITHUB_OUTPUT"
        fi
    - name: Extract Docker metadata
      uses: docker/metadata-action@v5
      id: meta
      with:
        images: ${{ steps.images.outputs.list }}
        tags: |
          type=raw,value=${{ steps.release.outputs.tag }}
          type=sha,prefix=sha-
          type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
